<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyric Loop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyric Loop">
<meta name="theme-color" content="#0B0B0C">
<meta name="description" content="Loop a beat and write lyrics in one place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,800;1,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0B0B0C; --panel:#151517; --well:#0E0E10; --btn:#1E1E21; --line:#26262A; --line2:#2E2E33;
  --text:#F5F5F4; --dim:#A1A1AA; --soft:#D4D4D8; --acc:#FF6A13; --acc2:#FF8A47; --accbg:rgba(255,106,19,.14);
  --ok:#4ADE80; --warn:#FBBF24;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --disp:Archivo,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;margin:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
textarea,input{font-family:inherit;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* splash */
#splash{align-items:center;justify-content:center;gap:28px;position:relative}
.wm{font-family:var(--disp);font-style:italic;font-weight:900;line-height:1;letter-spacing:-.01em}
.ul{height:5px;background:var(--acc);transform:skewX(-24deg)}
@keyframes pulse{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes fill{0%{width:8%}100%{width:96%}}
#splash .b{transform-origin:center;transform-box:fill-box;animation:pulse 1.1s ease-in-out infinite}
.sload{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:13px;color:var(--dim)}
.sbar{width:180px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:3px;background:var(--acc);animation:fill 1.3s ease-out forwards}

/* start */
#start{padding:28px 20px 20px;gap:24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#start h1{margin:0;font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.15}
#start p{margin:0;font-size:15px;color:var(--dim);line-height:1.5}
.big{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;border:1px solid var(--line2);background:var(--panel);text-align:left;width:100%}
.big.pri{background:var(--acc);color:#0B0B0C;border-color:var(--acc)}
.big .ic{width:44px;height:44px;border-radius:12px;background:#222226;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big.pri .ic{background:rgba(11,11,12,.14)}
.big b{display:block;font-size:17px;font-weight:600}
.big span{display:block;font-size:13px;color:var(--dim);margin-top:3px}
.big.pri span{color:#2B1405}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rec{display:flex;align-items:stretch;gap:8px}
.rec>button.open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid #222226;background:transparent;text-align:left;min-height:60px}
.rec .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .wh{font-size:12px;color:var(--dim);margin-top:2px}
.rec>button.del{width:48px;border-radius:12px;border:1px solid #222226;background:transparent;color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center}
.rec>button.del.sure{background:#3A1010;border-color:#7F1D1D;color:#FCA5A5;width:76px}
.col{display:flex;flex-direction:column;gap:12px}

/* workspace */
#work{flex-direction:column}
.player{background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:12px 16px}
.hd{display:flex;align-items:center;gap:8px}
.hd .logo{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hd .tt{flex:1;min-width:0}
.hd .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t2{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--btn);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.wave{position:relative;height:64px;border-radius:10px;background:var(--well);overflow:hidden;touch-action:none}
.wave canvas{position:absolute;left:0;top:0;height:100%;display:block}
.wave .prog{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden}
.wave .loop{position:absolute;top:0;bottom:0;background:rgba(255,106,19,.16);border-left:2px solid var(--acc);border-right:2px solid var(--acc);min-width:5px;pointer-events:none}
.wave .ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--text);pointer-events:none}
.wave .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px dashed #3F3F46;border-radius:10px;color:var(--soft);font-size:15px;font-weight:600;width:100%}
.timerow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.timerow .mid{color:var(--acc2)}
.tr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tb{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--btn);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;justify-content:center}
.tb.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2)}
.play{width:64px;height:64px;border-radius:32px;border:none;background:var(--acc);color:#0B0B0C;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:4px;background:var(--well);border-radius:10px;padding:3px;align-items:center}
.seg .lb{font-size:11px;color:var(--dim);padding:0 4px 0 6px}
.seg button{height:36px;min-width:34px;padding:0 9px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-size:12px;font-weight:600}
.seg button.on{background:#2A2A2E;color:var(--text)}
.seg.hot button.on{background:var(--acc);color:#0B0B0C}
.phr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.phr::-webkit-scrollbar{display:none}
.phr button{flex:0 0 auto;height:34px;min-width:50px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:transparent;color:var(--dim)}
.phr button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2)}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.bars button{height:36px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;background:var(--btn);color:var(--soft);padding:0;font-variant-numeric:tabular-nums}
.bars button.lp{background:var(--acc);color:#0B0B0C}
.bars button.cur{border-color:var(--text)}
.nobeat .needs{opacity:.35;pointer-events:none}

.editor{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.chips{display:flex;gap:6px;padding:10px 16px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:13px;font-weight:500}
.chips button.on{border-color:var(--text);background:var(--text);color:#0B0B0C;font-weight:600}
.chips button.add{width:36px;padding:0;border-style:dashed;border-color:#3F3F46;display:flex;align-items:center;justify-content:center}
.sech{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;flex-shrink:0}
.sech label{font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--acc2);text-transform:uppercase}
.sech button{height:36px;min-width:44px;border:none;border-radius:10px;background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center}
#ta{flex:1;min-height:0;width:100%;resize:none;border:none;background:transparent;color:var(--text);font-size:17px;line-height:1.65;padding:2px 16px 12px;outline:none;-webkit-overflow-scrolling:touch}
#ta::placeholder{color:#63636B}
.ft{display:flex;align-items:center;gap:8px;padding:6px 10px 8px 16px;border-top:1px solid #1F1F23;font-size:12px;color:var(--dim);flex-shrink:0}
.ft .st{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ft .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok);flex-shrink:0}
.dot.busy{background:var(--warn)}
.fb{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}

/* collapsed player (keyboard open or user choice), portrait only */
@media (orientation:portrait),(max-width:599px){
  #work.compact .player .x{display:none}
  #work.compact .player{gap:8px;padding-top:8px;padding-bottom:8px}
  #work.compact .play{width:48px;height:48px}
  #work.compact .hd .logo{display:none}
}
.onlyL{display:none}

@media (orientation:landscape) and (min-width:600px){
  #work{flex-direction:row}
  #work.right{flex-direction:row-reverse}
  .player{width:350px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--line);overflow-y:auto;gap:8px;padding:10px 14px}
  #work.right .player{border-right:none;border-left:1px solid var(--line)}
  .hd .logo,.onlyP{display:none!important}
  .onlyL{display:flex}
  .wave{height:46px}
  .tb{padding:0 9px}
  .seg .lb{display:none}
  .seg button{min-width:30px;padding:0 7px}
  .play{width:52px;height:52px}
  .seg button{height:32px}
  .phr button{height:30px}.bars button{height:30px}
  #ta{font-size:16px}
}
@media (orientation:landscape) and (min-width:1000px){ .player{width:390px} .seg .lb{display:inline} #ta{font-size:17px;padding-left:28px;padding-right:28px} .chips,.sech{padding-left:28px} }

/* computer (mouse) only: player on top, lyrics underneath, one centered column */
@media (hover:hover) and (pointer:fine){
  #work,#work.right{flex-direction:column;width:100%;max-width:760px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .player,#work.right .player{width:auto;flex-shrink:0;overflow:visible;border:none;border-bottom:1px solid var(--line);gap:10px;padding:14px 20px}
  .hd .logo{display:flex!important}
  .onlyP{display:flex!important}
  .onlyL{display:none!important}
  .wave{height:72px}
  .tb{padding:0 14px}
  .play{width:64px;height:64px}
  .seg .lb{display:inline}
  .seg button{height:36px;min-width:34px;padding:0 9px}
  .phr button{height:34px}.bars button{height:36px}
  .chips,.sech{padding-left:20px}
  #ta{font-size:18px;padding-left:20px;padding-right:20px}
  .ft{padding-left:20px}
}

/* sheets */
#shade{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:560px;margin:0 auto}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#3F3F46;flex-shrink:0}
.sheet h2{margin:0;font-family:var(--disp);font-weight:800;font-size:21px}
.sheet p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.sheet .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--well);color:var(--text);font-size:17px;padding:0 14px;outline:none}
.inp:focus{border-color:var(--acc)}
.pb{height:48px;border-radius:12px;border:none;background:var(--acc);color:#0B0B0C;font-size:15px;font-weight:600;padding:0 18px}
.sb{height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--btn);font-size:15px;font-weight:600;padding:0 16px}
.sb.danger{color:#FCA5A5}.sb.danger.sure{background:#3A1010;border-color:#7F1D1D}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.rowx{display:flex;gap:8px;align-items:center}
.rowx>*{flex:1}
.note{display:flex;gap:12px;padding:14px;border-radius:14px;border:1px dashed #3F3F46}
.note b{display:block;font-size:14px;color:var(--soft);margin-bottom:3px}
.kv{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
#work.typing .ft{display:none}
#toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2A2A2E;color:var(--text);font-size:13px;padding:10px 14px;border-radius:10px;z-index:30;max-width:86%;text-align:center;border:1px solid #3F3F46}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 100 100">
    <path d="M24 40 A27 27 0 0 1 76 40" fill="none" stroke="#FF6A13" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M67 29.5 L77 41 L63.5 44" fill="none" stroke="#FF6A13" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke-linecap="round" stroke-width="6.5">
      <line class="b" style="animation-delay:0s" x1="22" y1="57" x2="22" y2="69" stroke="#F5F5F4"/>
      <line class="b" style="animation-delay:.15s" x1="36" y1="49" x2="36" y2="77" stroke="#FF6A13"/>
      <line class="b" style="animation-delay:.3s" x1="50" y1="45" x2="50" y2="81" stroke="#FF6A13"/>
      <line class="b" style="animation-delay:.45s" x1="64" y1="51" x2="64" y2="75" stroke="#FF6A13"/>
      <line class="b" style="animation-delay:.6s" x1="78" y1="57" x2="78" y2="69" stroke="#F5F5F4"/>
    </g>
  </symbol>
</svg>

<div id="app">

  <!-- loading screen -->
  <section class="screen" id="splash">
    <svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Lyric Loop">
      <path d="M24 40 A27 27 0 0 1 76 40" fill="none" stroke="#FF6A13" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M67 29.5 L77 41 L63.5 44" fill="none" stroke="#FF6A13" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke-linecap="round" stroke-width="6.5">
        <line class="b" style="animation-delay:0s" x1="22" y1="57" x2="22" y2="69" stroke="#F5F5F4"/>
        <line class="b" style="animation-delay:.15s" x1="36" y1="49" x2="36" y2="77" stroke="#FF6A13"/>
        <line class="b" style="animation-delay:.3s" x1="50" y1="45" x2="50" y2="81" stroke="#FF6A13"/>
        <line class="b" style="animation-delay:.45s" x1="64" y1="51" x2="64" y2="75" stroke="#FF6A13"/>
        <line class="b" style="animation-delay:.6s" x1="78" y1="57" x2="78" y2="69" stroke="#F5F5F4"/>
      </g>
      <polygon points="20,88 84,88 81,92 17,92" fill="#F5F5F4"/>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div class="wm" style="font-size:40px">LYRIC LOOP</div>
      <div class="ul" style="width:210px"></div>
    </div>
    <div class="sload"><div class="sbar"><i></i></div><div id="splashMsg">Loading your last session…</div></div>
  </section>

  <!-- start -->
  <section class="screen" id="start" hidden>
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="34" height="34" aria-hidden="true"><use href="#mark"/></svg>
      <div class="wm" style="font-size:22px">LYRIC LOOP</div>
    </div>
    <div class="col" style="gap:6px">
      <h1>What are we writing?</h1>
      <p>Start new lyrics or pick up where you left off. Every change saves itself.</p>
    </div>
    <div class="col">
      <button class="big pri" id="btnNew">
        <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
        <div><b>New lyrics</b><span>Give it a name and start writing</span></div>
      </button>
      <button class="big" id="btnOpen">
        <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        <div><b>Open lyrics file</b><span>.txt, .md or .lrc from Files or Google Drive</span></div>
      </button>
    </div>
    <div class="col" style="gap:10px" id="recentWrap" hidden>
      <div class="cap">Recent</div>
      <div class="col" style="gap:8px" id="recent"></div>
    </div>
  </section>

  <!-- workspace -->
  <section class="screen nobeat" id="work" hidden>
    <div class="player" id="player">
      <div class="hd">
        <div class="logo"><svg width="26" height="26" aria-hidden="true"><use href="#mark"/></svg></div>
        <div class="tt"><div class="t1" id="songName">No beat loaded</div><div class="t2" id="songSub">Load a beat to start looping</div></div>
        <button class="ib" id="btnBeat" aria-label="Load a beat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
        <button class="ib needs" id="btnGrid" aria-label="Bar grid and tempo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="#1E1E21"/><circle cx="15" cy="12" r="2" fill="#1E1E21"/><circle cx="7" cy="18" r="2" fill="#1E1E21"/></svg></button>
        <button class="ib onlyP" id="btnFold" aria-label="Shrink player" aria-expanded="true"><svg id="foldIc" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg></button>
        <button class="ib onlyL" id="btnSide" aria-label="Move player to the other side"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 11 21 7 17 3"/><line x1="21" y1="7" x2="9" y2="7"/><polyline points="7 21 3 17 7 13"/><line x1="15" y1="17" x2="3" y2="17"/></svg></button>
      </div>

      <div class="wave x" id="wave">
        <canvas id="w1"></canvas>
        <div class="prog" id="prog"><canvas id="w2"></canvas></div>
        <div class="loop" id="loopBox" hidden></div>
        <div class="ph" id="ph" hidden></div>
        <button class="empty" id="btnEmpty"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Load a beat</button>
      </div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},

var docs=LS.get('ll.docs',{}),doc=null,dirty=false,saveT=null,cloudOK=false;
function newId(){return 'd'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36)}
function liveDocs(){return Object.keys(docs).map(function(k){return docs[k]}).filter(function(d){return !d.deleted}).sort(function(a,b){return b.updated-a.updated})}
function parseText(txt){

  return out}

  if(d.sections.length===1&&d.sections[0].name==='Lyrics')return d.sections[0].text.replace(/\s+$/,'')+'\n';
  return d.sections.map(function(s){return '['+s.name+']\n'+s.text.replace(/\s+$/,'')}).join('\n\n')+'\n'}
function fileName(d){return /\.(txt|md|lrc)$/i.test(d.name)?d.name:d.name+'.txt'}
function uniqueName(n){var names=liveDocs().map(function(d){return d.name.toLowerCase()});if(names.indexOf(n.toLowerCase())<0)return n;
  var m=/^(.*?)(\.[a-z0-9]+)?$/i.exec(n),i=2;while(names.indexOf((m[1]+' '+i+(m[2]||'')).toLowerCase())>=0)i++;return m[1]+' '+i+(m[2]||'')}

  if(persist(doc))setStatus(false,savedMsg());else setStatus(true,'Could not save on this device. Use Save .txt')}
function openDoc(d){flush();doc=d;if(d.cur>=d.sections.length)d.cur=0;LS.set('ll.last',d.id);renderDoc();setStatus(false,savedMsg());show('work');
  if(d.beat&&(!song||song.key!==d.beat))idbGet(d.beat).then(function(r){if(r&&doc===d)loadBeat(new Blob([r.buf],{type:r.type}),r.name,r.key,true)})}

  if(names.indexOf(base.toLowerCase())<0)return base;var i=2;while(names.indexOf((base+' '+i).toLowerCase())>=0)i++;return base+' '+i}

    '<div class="rowx"><button class="sb" id="mvL"'+(i===0?' disabled':'')+'>Move earlier</button><button class="sb" id="mvR"'+(i===doc.sections.length-1?' disabled':'')+'>Move later</button></div>'+
    '<button class="sb danger" id="delSec"'+(doc.sections.length<2?' disabled':'')+'>Delete this section</button>');

  $('mvL').onclick=function(){mv(-1)};$('mvR').onclick=function(){mv(1)};
  $('delSec').onclick=function(){if(!this.classList.contains('sure')){this.classList.add('sure');this.textContent='Tap again to delete "'+sec.name+'" and its lyrics';return}
    dirty=false;clearTimeout(saveT);doc.sections.splice(i,1);doc.cur=Math.max(0,i-1);doc.updated=Date.now();persist(doc);renderDoc();setStatus(false,savedMsg());closeSheet()}};

/* start screen */
function renderStart(){

function goStart(){flush();renderStart();show('start')}
$('btnFiles').onclick=goStart;
$('btnNew').onclick=function(){

$('btnOpen').onclick=function(){$('fText').value='';$('fText').click()};

  r.onload=function(){openDoc(createDoc(f.name,parseText(r.result)));toast('Opened a copy. The original file is not changed.')};
  r.onerror=function(){toast('Could not read that file.')};r.readAsText(f)};

/* export */
$('btnExport').onclick=function(){
  flush();var txt=serialize(doc),name=fileName(doc).replace(/\.(md|lrc)$/i,'.txt');
  var file=null;try{file=new File([txt],name,{type:'text/plain'})}catch(e){}
  var canShare=coarse()&&!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  var s=sheet('<h2>Save a copy</h2><p>'+esc(name)+' · plain text with [Section] headers. Pick <b>Save to Files</b> to put it in iCloud Drive, On My iPhone or Google Drive.</p>'+
    '<button class="pb" id="exSave">'+(canShare?'Save or share .txt':'Download .txt')+'</button>'+
    '<button class="sb" id="exCopy">Copy all lyrics</button><p id="exMsg" role="status"></p>');
  $('exSave').onclick=function(){
    if(canShare){navigator.share({files:[file],title:name}).then(function(){closeSheet();toast('Saved '+name)},function(e){if(!e||e.name!=='AbortError')dl()})}
    else dl()};
  function dl(){{try{var u=URL.createObjectURL(new Blob([txt],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);closeSheet();toast('Downloaded '+name)}

    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
    function fallback(){var t=document.createElement('textarea');t.value=txt;s.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){$('exMsg').textContent='Could not copy on this device.'}t.remove()}}};

function cloudPush(){}

/* ---------- beat storage (this device) ---------- */
var idb=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open('lyricloop',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('beats',{keyPath:'key'})};
  r.onsuccess=function(){idb=r.result;res(idb)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function idbReq(mode,fn){return new Promise(function(res){if(!idb)return res(null);try{var tx=idb.transaction('beats',mode),rq=fn(tx.objectStore('beats'));
  rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){res(null)};tx.onabort=function(){res(null)}}catch(e){res(null)}})}
function idbGet(k){return idbReq('readonly',function(s){return s.get(k)})}
function idbAll(){return idbReq('readonly',function(s){return s.getAll()}).then(function(a){return (a||[]).sort(function(x,y){return y.ts-x.ts})})}
function idbPut(rec){return idbReq('readwrite',function(s){return s.put(rec)}).then(function(){return idbAll()}).then(function(a){
  a.slice(4).forEach(function(r){idbReq('readwrite',function(s){return s.delete(r.key)})})})}

/* ---------- audio engine ---------- */
var audio=new Audio();audio.preload='auto';audio.setAttribute('playsinline','');
try{audio.preservesPitch=true;audio.webkitPreservesPitch=true;audio.mozPreservesPitch=true}catch(e){}
var song=null,peaks=null,songs=LS.get('ll.songs',{}),curUrl=null,loadTok=0,viewPhrase=0,lastBar=-9,lastPhr=-9;

var pcm=null,wa={on:false,ctx:null,src:null,key:'',buf:null,a:0,b:0,t0:0,off:0,sp:1};
function playing(){return wa.on||!audio['paused']}
function curTime(){if(wa.on){var len=wa.b-wa.a,e=(wa.ctx.currentTime-wa.t0)*wa.sp+wa.off;if(e<0)e=0;return wa.a+(e%len)}return audio['currentTime']}
function waCtx(){if(!wa.ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{wa.ctx=new C()}catch(e){return null}}
  if(wa.ctx.state!=='running'){try{var p=wa.ctx.resume();if(p&&p.catch)p.catch(function(){})}catch(e){}}return wa.ctx}
function waStop(){if(wa.src){try{wa.src.onended=null;wa.src.stop()}catch(e){}try{wa.src.disconnect()}catch(e){}wa.src=null}wa.on=false}
/* seamless loop: the looped bars are rendered into one buffer (time-stretched when slowed) and looped sample-accurately */
function loopBuffer(ctx,a,b,sp){
  var sr=pcm.sr,nc=pcm.nc,d=pcm.d,s0=Math.round(a*sr),s1=Math.min(pcm.n,Math.round(b*sr)),Lin=s1-s0;if(Lin<2048)return null;
  var PAD=8192,ext=[],c,i,n=Lin+2*PAD;
  for(c=0;c<nc;c++){var x=new Float32Array(n);for(i=0;i<n;i++){var si=s0-PAD+i;if(si>=0&&si<pcm.n)x[i]=d[si*nc+c]/32768}ext.push(x)}
  var F=256,Lout,outs=[],w,j;
  if(sp===1){Lout=Lin;for(c=0;c<nc;c++){var o1=ext[c].slice(PAD,PAD+Lin);for(i=0;i<F;i++){w=i/F;o1[Lout-F+i]=o1[Lout-F+i]*(1-w)+ext[c][PAD-F+i]*w}outs.push(o1)}}

    var g=ext[0];if(nc>1){g=new Float32Array(n);for(i=0;i<n;i++)g[i]=(ext[0][i]+ext[1][i])*0.5}
    var win=new Float32Array(N);for(i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
    var acc=[];for(c=0;c<nc;c++)acc.push(new Float32Array(Lout+O+N+Hs));
    var prev=0,k,sel;
    for(k=-2;k*Hs<Lout;k++){
      var target=PAD+Math.round(k*Ha);
      if(k===-2)sel=target;else{var nat=prev+Hs,best=-1e30,bd=0;
        if(Math.abs(nat-target)<=tol)bd=nat-target;
        else{for(var dd=-tol;dd<=tol;dd+=2){var cc=0,q=target+dd;for(j=0;j<480;j+=4)cc+=g[nat+j]*g[q+j];if(cc>best){best=cc;bd=dd}}}
        sel=target+bd}
      if(sel<0)sel=0;if(sel>n-N-600)sel=n-N-600;
      var base=O+k*Hs;for(c=0;c<nc;c++){var xa=ext[c],oa=acc[c];for(i=0;i<N;i++)oa[base+i]+=win[i]*xa[sel+i]}
      prev=sel}
    for(c=0;c<nc;c++){var o2=acc[c].slice(O,O+Lout);for(i=0;i<F;i++){w=i/F;o2[Lout-F+i]=o2[Lout-F+i]*(1-w)+acc[c][O-F+i]*w}outs.push(o2)}}
  var buf=ctx.createBuffer(nc,Lout,sr);for(c=0;c<nc;c++){if(buf.copyToChannel)buf.copyToChannel(outs[c],c);else buf.getChannelData(c).set(outs[c])}
  return buf}
function waStart(t,r){var ctx=waCtx();if(!ctx||!pcm)return false;var key=r[0]+'|'+r[1]+'|'+song.speed;
  try{if(wa.key!==key||!wa.buf){wa.buf=loopBuffer(ctx,r[0],r[1],song.speed);wa.key=key}
    if(!wa.buf)return false;waStop();
    var src=ctx.createBufferSource();src.buffer=wa.buf;src.loop=true;src.connect(ctx.destination);
    var off=clamp(t-r[0],0,r[1]-r[0]-0.001),at=ctx.currentTime+0.03;src.start(at,Math.min(wa.buf.duration-0.001,off/song.speed));
    wa.src=src;wa.a=r[0];wa.b=r[0]+wa.buf.duration*song.speed;wa.t0=at;wa.off=off;wa.sp=song.speed;wa.on=true;return true}
  catch(e){wa.on=false;return false}}

/* tempo + first downbeat detection */
function detectTempo(ab){

  var flux=new Float32Array(n),prev=Math.log(1+60*e[0]/mx);
  for(i=1;i<n;i++){var c=Math.log(1+60*e[i]/mx);flux[i]=c>prev?c-prev:0;prev=c}
  var minLag=Math.floor(fps*60/200),maxLag=Math.ceil(fps*60/60),acf=new Float32Array(maxLag*4+2);
  for(var lag=minLag;lag<=maxLag*4&&lag<n/2;lag++){var a=0;for(i=0;i<n-lag;i++)a+=flux[i]*flux[i+lag];acf[lag]=a/(n-lag)}
  var best=0,bl=minLag;
  for(lag=minLag;lag<=maxLag;lag++){var bpm=60*fps/lag,sc=acf[lag]+0.5*acf[lag*2]+0.25*acf[lag*4];
    var pr=Math.log(bpm/105)/Math.LN2/0.9;sc*=Math.exp(-0.5*pr*pr);if(sc>best){best=sc;bl=lag}}
  var bpm0=60*fps/bl;

    var m=0,mi=0;for(var b=0;b<bins;b++){var v=h[b]+h[(b+1)%bins]+h[(b+bins-1)%bins];if(v>m){m=v;mi=b}}return{score:m,bin:mi,h:h,per:per}}
  var bb=bpm0,bs=0;for(var q=bpm0*0.96;q<=bpm0*1.04;q+=0.01){var f=fold(q,96);if(f.score>bs){bs=f.score;bb=q}}
  var r=Math.round(bb);if(Math.abs(bb-r)<0.15&&fold(r,96).score>=bs*0.88)bb=r;else{var h2=Math.round(bb*2)/2;if(Math.abs(bb-h2)<0.08&&fold(h2,96).score>=bs*0.97)bb=h2;else bb=Math.round(bb*100)/100}
  var F=fold(bb,96),B=96,b0=F.bin,w0=F.h[(b0+B-1)%B],w1=F.h[b0],w2=F.h[(b0+1)%B];
  var cen=b0+0.5+((w2-w0)/(w0+w1+w2||1));var beat=60/bb,phase=((cen/B)*F.per)/fps;phase=((phase%beat)+beat)%beat;
  var nb=Math.floor((n/fps-phase)/beat),str=[],k;
  for(k=0;k<nb;k++){var fi=Math.round((phase+k*beat)*fps),m=0;for(j=fi-2;j<=fi+2;j++)if(j>0&&j<n&&flux[j]>m)m=flux[j];str.push(m)}

  for(k=0;k<nb;k++)if(str[k]>=thr){k0=k;break}
  return{bpm:bb,phase:phase+k0*beat}}

/* grid math */
function beatDur(){return 60/song.bpm}
function barDur(){return 240/song.bpm}
function origin(){var b=barDur(),o=((song.phase+song.shift)%b+b)%b;if(o>b-0.03)o-=b;return o}
function barTime(n){return origin()+n*barDur()}
function barAt(t){return Math.max(0,Math.floor((t-origin())/barDur()+1e-4))}
function nBars(){return Math.max(1,Math.ceil((song.dur-origin())/barDur()-0.02))}
function loopRange(){return[Math.max(0,barTime(song.loopStart)),Math.min(song.dur,barTime(song.loopStart+song.loopLen))]}

function setSub(m){$('songSub').textContent=m}
function loadBeat(blob,name,key,quiet){
  var tok=++loadTok;key=key||(name+':'+blob.size);
  waStop();pcm=null;audio.pause();$('songName').textContent=name;setSub('Reading file…');
  var fr=new FileReader();
  fr.onerror=function(){if(tok===loadTok){setSub('Could not read that file');toast('Could not read that file.')}};
  fr.onload=function(){
    if(tok!==loadTok)return;var buf=fr.result;
    if(!quiet)idbPut({key:key,name:name,type:blob.type||'audio/mpeg',size:blob.size,buf:buf,ts:Date.now()});
    else idbGet(key).then(function(r){if(r){r.ts=Date.now();idbPut(r)}});
    setSub('Decoding audio…');
    decode(buf.slice(0)).then(function(ab){
      if(tok!==loadTok)return;setSub('Finding the tempo…');
      setTimeout(function(){
        if(tok!==loadTok)return;
        var sv=songs[key],det=sv&&sv.dbpm?{bpm:sv.dbpm,phase:sv.dphase}:detectTempo(ab);
        peaks=makePeaks(ab,600);
        var enc=ab.duration<=720?encodeWav(ab):null,src=enc?enc.blob:blob;pcm=enc?{d:enc.pcm,nc:enc.nc,sr:enc.sr,n:enc.pcm.length/enc.nc}:null;
        song={key:key,name:name,dur:ab.duration,dbpm:det.bpm,dphase:det.phase,bpm:sv?sv.bpm:det.bpm,phase:det.phase,shift:sv?sv.shift||0:0,
          loopOn:sv?!!sv.loopOn:false,loopStart:sv?sv.loopStart||0:0,loopLen:sv?sv.loopLen||1:1,speed:sv?sv.speed||1:1,pos:sv?sv.pos||0:0};
        ab=null;if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(src);
        audio.src=curUrl;audio.load();
        var ready=function(){audio.removeEventListener('loadedmetadata',ready);if(tok!==loadTok)return;
          if(isFinite(audio.duration)&&audio.duration>0&&Math.abs(audio.duration-song.dur)<2)song.dur=audio.duration;
          applySpeed();try{audio.currentTime=clamp(song.pos,0,song.dur-0.05)}catch(e){}
          $('work').classList.remove('nobeat');$('btnEmpty').hidden=true;$('ph').hidden=false;$('tDur').textContent=fmt(song.dur);
          lastBar=lastPhr=-9;viewPhrase=Math.floor(barAt(song.pos)/8);refreshAll();
          if(doc){doc.beat=key;persist(doc)}saveSong()};
        audio.addEventListener('loadedmetadata',ready);
      },30);
    },function(){if(tok!==loadTok)return;setSub('This file type could not be opened');toast('That audio file could not be opened. Try MP3, WAV or M4A.')});
  };
  fr.readAsArrayBuffer(blob)}
function saveSong(withPos){if(!song)return;songs[song.key]={name:song.name,dbpm:song.dbpm,dphase:song.dphase,bpm:song.bpm,shift:song.shift,loopOn:song.loopOn,loopStart:song.loopStart,loopLen:song.loopLen,speed:song.speed,
  pos:withPos?curTime():(songs[song.key]&&songs[song.key].pos)||0,ts:Date.now()};
  var ks=Object.keys(songs);if(ks.length>40){ks.sort(function(a,b){return(songs[a].ts||0)-(songs[b].ts||0)});delete songs[ks[0]]}LS.set('ll.songs',songs)}
function applySpeed(){audio.playbackRate=song.speed;try{audio.preservesPitch=true;audio.webkitPreservesPitch=true}catch(e){}
  $('segSpeed').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',parseFloat(b.dataset.v)===song.speed)})}
function seek(t,play){if(!song)return;var was=playing();waStop();t=clamp(t,0,Math.max(0,song.dur-0.02));try{audio.currentTime=t}catch(e){}if(play||was)doPlay();else setPlayIcon();paint(t)}

  if(song.loopOn&&pcm){var r=loopRange(),t=audio['currentTime'];if(t<r[0]||t>=r[1]-0.01)t=r[0];if(waStart(t,r)){audio.pause();setPlayIcon();return}}
  var p=audio.play();if(p&&p.catch)p.catch(function(){toast('Tap play to start the audio.')})}

  if(song.loopOn&&pcm){var r=loopRange();if(wa.on&&wa.key===r[0]+'|'+r[1]+'|'+song.speed)return;waStop();try{audio.currentTime=t}catch(e){}doPlay()}
  else if(wa.on){waStop();try{audio.currentTime=t}catch(e){}doPlay()}}
function setLoopStart(b){song.loopStart=clamp(b,0,Math.max(0,nBars()-1));paintLoop();saveSong()}
function bpmText(){return (Math.round(song.bpm*100)/100)+' BPM'}

/* painting */
function layoutWave(){var w=$('wave'),cw=w.clientWidth,ch=w.clientHeight;if(!cw)return;var dpr=Math.min(3,window.devicePixelRatio||1);
  ['w1','w2'].forEach(function(id,k){var c=$(id);c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr);c.style.width=cw+'px';
    var g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!peaks)return;g.fillStyle=k?'#C9C9D1':'#4A4A52';
    var nb=Math.floor(cw/3),bw=c.width/nb;for(var i=0;i<nb;i++){var p=0,j0=Math.floor(i/nb*peaks.length),j1=Math.max(j0+1,Math.floor((i+1)/nb*peaks.length));for(var j=j0;j<j1;j++)if(peaks[j]>p)p=peaks[j];var h=Math.max(2*dpr,p*c.height*0.86);
      g.fillRect(i*bw,(c.height-h)/2,Math.max(1,bw-dpr),h)}});
  if(song){paintLoop();paint(curTime())}}
function paintLoop(){var lb=$('loopBox');if(!song||!song.loopOn){lb.hidden=true;$('tMid').textContent='';}
  else{var r=loopRange();lb.hidden=false;lb.style.left=(r[0]/song.dur*100)+'%';lb.style.width=((r[1]-r[0])/song.dur*100)+'%';
    $('tMid').textContent='Loop · bar '+(song.loopStart+1)+(song.loopLen>1?'–'+(song.loopStart+song.loopLen):'')}
  $('btnLoop').classList.toggle('on',!!(song&&song.loopOn));$('btnLoop').setAttribute('aria-pressed',song&&song.loopOn?'true':'false');
  if(song)$('segLen').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===song.loopLen)});
  paintBars(true)}
function paint(t){if(!song)return;var pc=clamp(t/song.dur*100,0,100);$('ph').style.left=pc+'%';$('prog').style.width=pc+'%';$('tCur').textContent=fmt(t);
  var b=barAt(t);if(b!==lastBar){lastBar=b;var p=Math.floor(b/8);setSub(bpmText()+' · Bar '+(b+1)+' · Phrase '+(p+1));
    if(p!==lastPhr){lastPhr=p;viewPhrase=p;paintPhrases()}paintBars(true)}}

  if(box.children.length!==n){box.innerHTML='';for(var i=0;i<n;i++){(function(i){var b=document.createElement('button');b.textContent='P'+(i+1);b.setAttribute('aria-label','Phrase '+(i+1));
    b.onclick=function(){viewPhrase=i;if(song.loopOn)setLoopStart(i*8);seek(Math.max(0,barTime(i*8)),true);paintPhrases();paintBars()};box.appendChild(b)})(i)}}
  for(var k=0;k<n;k++)box.children[k].classList.toggle('on',k===viewPhrase);
  var on=box.children[viewPhrase];if(on)box.scrollLeft=Math.max(0,on.offsetLeft-box.clientWidth/2+on.offsetWidth/2);paintBars()}
function paintBars(classOnly){var box=$('bars');if(!song)return;var first=viewPhrase*8,total=nBars();
  if(!classOnly||box.children.length!==8||box.dataset.first!=first){box.innerHTML='';box.dataset.first=first;
    for(var i=0;i<8;i++){(function(n){var b=document.createElement('button');b.textContent=n+1;b.setAttribute('aria-label','Bar '+(n+1));if(n>=total)b.disabled=true;
      b.onclick=function(){if(song.loopOn)setLoopStart(n);seek(Math.max(0,barTime(n)),true)};box.appendChild(b)})(first+i)}}
  for(var k=0;k<box.children.length;k++){var n=first+k;box.children[k].classList.toggle('lp',song.loopOn&&n>=song.loopStart&&n<song.loopStart+song.loopLen);box.children[k].classList.toggle('cur',n===lastBar)}}
function refreshAll(){applySpeed();paintLoop();layoutWave();paintPhrases();paint(curTime());setPlayIcon()}
function setPlayIcon(){var p=!!playing();$('icPlay').hidden=p;$('icPause').hidden=!p;$('btnPlay').setAttribute('aria-label',p?'Pause':'Play')}
function tick(){if(song){var t=curTime();
    if(song.loopOn&&!wa.on&&!audio['paused']){var r=loopRange();if(t>=r[1]-0.012||t<r[0]-0.3){try{audio.currentTime=r[0]}catch(e){}t=r[0]}}
    paint(t)}
  requestAnimationFrame(tick)}
audio.addEventListener('play',setPlayIcon);audio.addEventListener('pause',function(){setPlayIcon();saveSong(true)});
audio.addEventListener('ended',function(){if(song&&song.loopOn&&!wa.on){seek(loopRange()[0],true)}else setPlayIcon()});

/* controls */
$('btnPlay').onclick=function(){if(!song)return;if(!playing()){if(curTime()>=song.dur-0.05)seek(0);doPlay()}else doPause()};
$('btnLoop').onclick=function(){if(!song)return;song.loopOn=!song.loopOn;if(song.loopOn)song.loopStart=clamp(barAt(curTime()),0,nBars()-1);paintLoop();syncEngine();saveSong()};
$('btnPrev').onclick=function(){if(!song)return;if(song.loopOn){setLoopStart(song.loopStart-1);seek(loopRange()[0])}
  else{var t=curTime(),b=barAt(t);if(t-barTime(b)<0.35*(!playing()?0.2:1))b--;seek(Math.max(0,barTime(Math.max(0,b))))}};
$('btnNext').onclick=function(){if(!song)return;if(song.loopOn){setLoopStart(song.loopStart+1);seek(loopRange()[0])}
  else{var b=barAt(curTime())+1;if(b<nBars())seek(barTime(b))}};
$('btnRestart').onclick=function(){if(!song)return;seek(song.loopOn?loopRange()[0]:Math.max(0,barTime(barAt(curTime()))))};
$('segSpeed').onclick=function(e){var b=e.target.closest('button');if(!b||!song)return;song.speed=parseFloat(b.dataset.v);applySpeed();syncEngine();saveSong()};
$('segLen').onclick=function(e){var b=e.target.closest('button');if(!b||!song)return;song.loopLen=+b.dataset.v;paintLoop();syncEngine();saveSong()};
(function(){var w=$('wave'),drag=false;
  function at(e){var r=w.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*song.dur}
  w.addEventListener('pointerdown',function(e){if(!song||e.target.closest('button'))return;drag=true;try{w.setPointerCapture(e.pointerId)}catch(x){}paint(at(e))});
  w.addEventListener('pointermove',function(e){if(drag)paint(at(e))});
  function end(e){if(!drag)return;drag=false;var t=at(e);if(song.loopOn){var r=loopRange();if(t<r[0]||t>=r[1])setLoopStart(barAt(t))}seek(t)}
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',function(){drag=false})})();

    '<div class="rowx"><span class="kv" id="gDet" style="flex:2"></span><button class="sb" id="gResetBpm" style="height:40px;font-size:13px">Use detected</button></div>'+

    var beats=song.shift/beatDur();$('gShift').textContent='Shift from detected: '+(beats>=0?'+':'−')+Math.abs(Math.round(beats*1000)/1000)+' beat ('+Math.round(song.shift*1000)+' ms)';
    $('gStep').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===stepDiv)});

  upd()};

var kbGuess=false,baseH=0,kbT=null;
function viewH(){var vv=window.visualViewport;return vv?vv.height:window.innerHeight}
function kbHeight(){var port=window.innerHeight>=window.innerWidth,sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height);return Math.round(port?sh*0.44:sw*0.58)}
function startTyping(){if(typing)return;typing=true;baseH=viewH();kbGuess=coarse();fit();applyLayout();clearTimeout(kbT);kbT=setTimeout(checkKb,650)}
function checkKb(){if(typing&&kbGuess&&baseH-viewH()>100){kbGuess=false;fit()}}
function stopTyping(){typing=false;typeOpen=false;kbGuess=false;clearTimeout(kbT);fit();setTimeout(applyLayout,60)}
/* shrink the layout before the keyboard appears, so the page has no reason to slide */
$('ta').addEventListener('pointerdown',function(){if(coarse())startTyping()});
$('ta').addEventListener('focus',startTyping);
$('ta').addEventListener('blur',stopTyping);
/* keep the keyboard up when tapping player buttons */
$('player').addEventListener('pointerdown',function(e){if(document.activeElement===$('ta')&&e.target.closest('button'))e.preventDefault()});
function fit(){var vv=window.visualViewport,app=$('app'),h=viewH(),top=vv?vv.offsetTop:0;
  if(kbGuess){if(baseH-h>100){kbGuess=false}else{h=Math.max(240,window.innerHeight-kbHeight());top=0}}
  app.style.height=h+'px';app.style.top=top+'px';if(window.scrollY||document.documentElement.scrollTop)window.scrollTo(0,0);layoutWave()}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
window.addEventListener('resize',fit);window.addEventListener('scroll',function(){if(typing)window.scrollTo(0,0)});window.addEventListener('orientationchange',function(){setTimeout(fit,250)});
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('dblclick',function(e){e.preventDefault()});

/* ---------- boot ---------- */
fit();applyLayout();requestAnimationFrame(tick);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
var t0=Date.now();
idbOpen().then(function(){
  var last=docs[LS.get('ll.last','')];
  if(!last||last.deleted)$('splashMsg').textContent='Getting ready…';
  setTimeout(function(){if(last&&!last.deleted)openDoc(last);else{renderStart();show('start')}},Math.max(0,1300-(Date.now()-t0)))});
window.__ll={time:curTime,playing:playing,wa:wa,loopBuffer:loopBuffer,detectTempo:detectTempo,parseText:parseText,serialize:serialize,get song(){return song},audio:audio};
})();
